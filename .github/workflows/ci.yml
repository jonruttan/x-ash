name: CI

# The bundle CI the platform ships, in x-lang's .github/workflows/bundle.yml:
# the suite against the release lang.xon declares, and against x-lang main on
# a push to main, the weekly schedule and a manual dispatch.  The suite runs
# on Ubuntu only, as it did before it moved there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because x-lang can move while this repository sits still.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  ci:
    uses: jonruttan/x-lang/.github/workflows/bundle.yml@main
    with:
      os: '["ubuntu-24.04"]'

  # The image is what `x -l ash` boots from and what x-os ships; a write that
  # fails here fails the job, where the spec runner would fall back to booting
  # from source and say nothing.  Run from inside the x-lang checkout: x.sh
  # reads its mode from the working directory, and from anywhere else it looks
  # for an install tree.
  image:
    name: boot image writes @ declared release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check out x-lang at the declared release
        run: |
          declared=$(sed -n 's/^(requires-release "\(.*\)")$/\1/p' lang.xon)
          git clone --depth 1 --branch "$declared" \
            https://github.com/jonruttan/x-lang.git .x-lang
      - name: Build the platform
        working-directory: .x-lang
        run: |
          make engine
          make
          make boot
      - name: Write the boot image
        run: cd .x-lang && X_LANG_DIR="$(dirname "$GITHUB_WORKSPACE")/" sh x.sh --image -l ash
